name: Feature request
description: 想要一个新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不便
      description: 描述场景，不用急着给方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望的解法
      description: 可选。如果想到了怎么实现，写在这里
  - type: dropdown
    id: area
    attributes:
      label: 相关部分
      options:
        - 生成参数（时长 / 比例 / 模型）
        - 图生视频 / 首尾帧
        - 文件保存与命名
        - 登录态与配置
        - 错误处理与重试
        - 文档
        - 其他
